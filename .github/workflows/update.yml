name: Update Church Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "5 6 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: update-church-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install -r requirements.txt

      - name: Compile Python script
        run: python -m py_compile temple_attendance_datawrapper3.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run Church Stats
        env:
          DATAWRAPPER_TOKEN: ${{ secrets.DATAWRAPPER_TOKEN }}
          DATAWRAPPER_US_CHART_ID: ${{ secrets.DATAWRAPPER_US_CHART_ID }}
          DATAWRAPPER_COUNTRIES_CHART_ID: ${{ secrets.DATAWRAPPER_COUNTRIES_CHART_ID }}
          DATAWRAPPER_HISTORICAL_CHART_ID: ${{ secrets.DATAWRAPPER_HISTORICAL_CHART_ID }}
        run: python temple_attendance_datawrapper3.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temple_attendance_output/
          git diff --cached --quiet || git commit -m "Update Church Stats data"
          git push
